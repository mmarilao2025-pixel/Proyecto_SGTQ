name: Checks & Tests

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      # Equivalente a: uv run ruff check .
      - name: Run ESLint (lint)
        run: npm run lint

      # Equivalente a: uv run ruff format --check .
      # Prettier valida que el formato sea correcto sin modificar archivos
      - name: Run Prettier (format check)
        run: npx prettier --check "backend/**/*.js" "shared/**/*.js" "frontend/src/**/*.{ts,tsx}"

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install

      # Equivalente a: uv run ty check
      - run: npm run type-check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install

      # Los TransactionTests requieren BD real → se excluyen en CI (CI=true lo
      # detecta jest.config.cjs via testPathIgnorePatterns)
      # Equivalente a: uv run pytest
      - name: Run Jest tests
        run: npm run test:coverage
        env:
          CI: true