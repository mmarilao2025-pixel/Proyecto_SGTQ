sonar.projectKey=syntaxerror
sonar.projectName=SGTQ - SyntaxError

# Carpetas con código fuente real (sin tests, sin node_modules)
sonar.sources=backend,shared,frontend/src

# Tests separados para que SonarQube los identifique correctamente
sonar.tests=backend/tests

sonar.sourceEncoding=UTF-8

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js,**/*Test.js,**/*Tests.js,**/*.test.ts,**/*Test.ts,**/*Tests.ts

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Cobertura: Jest genera lcov.info con el reporter "lcov"
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Opcional: umbral mínimo (SonarQube lo muestra en el Quality Gate)
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,backend/tests/**